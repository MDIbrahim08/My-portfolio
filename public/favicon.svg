<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a20" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.4)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
  </defs>
  
  <!-- Obsidian Base -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="50" cy="50" r="30" fill="#ffffff" opacity="0.06" filter="blur(8px)" />

  <!-- Monogram MI -->
  <text x="50" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Montserrat', 'Inter', sans-serif" font-size="38" font-weight="900" fill="url(#silverGrad)" text-anchor="middle" letter-spacing="-1">
    MI
  </text>
  
  <!-- AI Sparkle Indicator -->
  <circle cx="76" cy="24" r="4" fill="#38bdf8" />
</svg>
